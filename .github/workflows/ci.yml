name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a PR, but never cancel a push-to-main build so
  # every main commit keeps a completed CI status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js for CLI integration tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned Copilot CLI
        run: bash docker/install-scripts/install-copilot.sh

      - name: Install Pi CLI
        run: bash docker/install-scripts/install-pi.sh

      # Verification artifacts and proof sources are content-locked. Key the
      # cache on both locks and their installers; setup also verifies restored
      # bytes before reuse.
      - name: Cache TLAPS toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.tlapm
            ~/.apalache
            lib/tla2tools.jar
            lib/tlapm
            lib/community
          key: tlaps-deps-${{ runner.os }}-${{ hashFiles('scripts/install_deps.sh', 'scripts/install_proof_libraries.py', 'src/common/verification_toolchain.py', 'config/proof-library-sources.json', 'config/verification-toolchain.json') }}

      - name: Run make setup
        run: make setup

      - name: Verify lib/tla2tools.jar is present
        run: test -f lib/tla2tools.jar

      - name: Lint with ruff
        run: uv run ruff check

      - name: Check formatting with ruff
        run: uv run ruff format --check

      - name: Run pytest
        env:
          PYTHONPATH: src
          TLAPS_BENCH_REQUIRE_COPILOT_CLI: "1"
          TLAPS_BENCH_REQUIRE_PI_CLI: "1"
        run: uv run pytest tests

      - name: Verify generated proof-from-scratch module suite
        env:
          PYTHONPATH: src
        run: uv run python -m dataset.proof_from_scratch.module_tasks --verify

      - name: Check tlaps-bench CLI help
        run: |
          set -euo pipefail
          uv run tlaps-bench --help
          for sub in run check validate generate score; do
            echo "--- tlaps-bench $sub --help ---"
            uv run tlaps-bench "$sub" --help
          done
